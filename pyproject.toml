[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsi-eval-lab"
version = "0.1.0"
description = "Dynamic safety evaluation tools for recursively self-improving AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Javier Campos" }]
keywords = ["ai-safety", "evaluations", "rsi", "inspect-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
rsi-eval = "rsi_eval_lab.cli:main"

[project.urls]
Repository = "https://github.com/javcamposz/evals_RSI"
Research = "https://github.com/javcamposz/evals_RSI/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/rsi_eval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
