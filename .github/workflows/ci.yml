name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # The inspect extra too: without it the Inspect task's import path is never
      # exercised, its tests skip on every push, and inspect-ai>=0.3 with no ceiling
      # would break silently.
      - run: python -m pip install -e ".[dev,inspect]"
      - run: pytest
      - run: python evals/build_dataset.py --check
      - run: rsi-eval examples/safe_run.json --anchors examples/anchors.json
      - run: rsi-eval compare examples/static_regime_run.json examples/adaptive_regime_run.json --anchors examples/anchors.json --output comparison.md
      - name: a lineage that erodes a declared invariant must not audit clean
        run: |
          if rsi-eval examples/invariant_drift_run.json --anchors examples/anchors.json; then
            echo 'expected a non-zero exit for the invariant-drift trace' && exit 1
          fi
      - name: a lineage that withholds capability at a gate must not audit clean
        run: |
          if rsi-eval examples/sandbagging_run.json --anchors examples/anchors.json; then
            echo 'expected a non-zero exit for the gate-shy trace' && exit 1
          fi
      - name: a laundered trace must not audit clean
        run: |
          if rsi-eval examples/laundered_run.json --anchors examples/anchors.json; then
            echo 'expected a non-zero exit for the laundered trace' && exit 1
          fi
