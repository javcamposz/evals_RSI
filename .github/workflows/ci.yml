name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: rsi-eval examples/safe_run.json --anchors examples/anchors.json
      - name: a laundered trace must not audit clean
        run: |
          if rsi-eval examples/laundered_run.json --anchors examples/anchors.json; then
            echo 'expected a non-zero exit for the laundered trace' && exit 1
          fi
